[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tragent"
version = "0.1.0"
description = "Durable AI agent system for US equity strategy research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "langchain",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "yfinance",
    "exchange-calendars",
    "fastapi",
    "uvicorn",
    "PyJWT",
    "beautifulsoup4",
    "feedparser",
    "edgartools",
    "httpx",
    "ib_async",
    "docker",
    "confluent-kafka",
    "boto3",
    "python-multipart",
    "celery[redis]",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]",
    "httpx2",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
