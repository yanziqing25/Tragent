# The infrastructure, which development runs alone with `docker compose up -d` while the apps run
# on the host and reach it on localhost; with `--profile app`, the whole platform behind Nginx on
# http://localhost:8080. Credentials come from the project's .env.
name: tragent

# Every Python process shares one image and reaches the infrastructure by service name.
x-app: &app
  build: .
  image: tragent-app
  profiles: [app]
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    S3_ENDPOINT_URL: http://seaweedfs:8333
    # Browsers download through Nginx, so links are signed for its address.
    S3_PUBLIC_URL: http://localhost:8080
    GATEWAY_NETWORK: tragent_default
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
    restart: unless-stopped

  redis:
    image: redis:alpine
    # Redis also queues Celery runs, so every write is logged and flushed each second.
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka
    # One node is both broker and KRaft controller. Any setting given here replaces the image's
    # defaults, so the whole single-node configuration is spelled out.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The host's apps connect on localhost:9092; containers on kafka:19092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null
      interval: 10s
      start_period: 20s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs
    # One process runs the master, a volume server, the filer, and the S3 gateway. The key pair is
    # its only S3 identity, so anonymous requests are refused.
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The S3 gateway is up once it refuses an anonymous request.
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' localhost:8333)\" = 403 ]"]
      interval: 5s
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: uvicorn tragent.api.app:create_app --factory --host 0.0.0.0 --port 8000
    # The API starts and removes each user's Gateway container through the host's Docker.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    <<: *app
    command: celery -A tragent.worker worker --concurrency=16 --loglevel=info

  beat:
    <<: *app
    command: celery -A tragent.worker beat --loglevel=info --schedule /tmp/celerybeat-schedule

  broker:
    <<: *app
    command: python -m tragent.trading.broker

  web:
    build: frontend
    image: tragent-web
    profiles: [app]
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  seaweedfs-data:
