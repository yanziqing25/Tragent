# The one public entry point: the Vue app, the API with its WebSocket and SSE streams, and the
# object store's presigned links.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream api {
    # WebSockets stay open, so each new connection goes to the instance holding the fewest; the
    # zone shares those counts across Nginx's workers, which would otherwise each start anew.
    zone api 64k;
    least_conn;
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 11m;

    location / {
        root /usr/share/nginx/html;
        # Client-side routes all load the app.
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Research progress is an event stream, so events pass through as they come.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The bucket's path. A presigned link is signed for this host, so the store sees it unchanged.
    location /tragent/ {
        proxy_pass http://seaweedfs:8333;
        proxy_set_header Host $http_host;
    }
}
